; Supervisor config for the Laravel queue worker.
; Install on the droplet:
;   sudo cp ops/propfirm-worker.conf /etc/supervisor/conf.d/propfirm-worker.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start propfirm-worker:*
;
; Start with one worker on the 1 GB droplet; raise numprocs after resizing
; to 2 GB (and again when MT5 automation adds sync jobs).

[program:propfirm-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/propfirm-platform/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/propfirm-platform/storage/logs/worker.log
stopwaitsecs=3600
